        &lt;h3&gt;通用优化优先级&lt;/h3&gt;
        &lt;div class=&quot;funnel&quot;&gt;
          &lt;div class=&quot;funnel-step&quot;&gt;&lt;strong&gt;1 · 减少通信范围与字节&lt;/strong&gt;&lt;div class=&quot;text-small muted&quot;&gt;布局、分片、减少 materialize / gather&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;timeline-row&quot;&gt;&lt;div class=&quot;timeline-label&quot;&gt;Comm&lt;/div&gt;&lt;div class=&quot;timeline-block&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block comm&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block comm&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block comm&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block comm&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block exposed&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block&quot;&gt;&lt;/div&gt;&lt;div class=&quot;timeline-block&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;text-small muted&quot;&gt;与 Compute 重叠的 Comm 通常不增加 step time；Exposed 通信尾段才直接位于关键路径。Barrier 前后的计时还会把其他 rank 的迟到算进“通信时间”。&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;distributed-comm-map&#x27;);
      const stored = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.privateContent;
      const state = {
        view: stored &amp;&amp; stored.view || &#x27;ownership&#x27;,
        scenario: stored &amp;&amp; stored.scenario || &#x27;tp&#x27;,
        collective: stored &amp;&amp; stored.collective || &#x27;allreduce&#x27;,
        stage: stored &amp;&amp; Number.isInteger(stored.stage) ? stored.stage : 0,
        protocol: stored &amp;&amp; stored.protocol || &#x27;nccl&#x27;,
        bottleneck: stored &amp;&amp; stored.bottleneck || &#x27;exposed&#x27;
      };

      const scenarios = {
        tp: {
          label: &#x27;TP / SP Linear&#x27;, verdict: &#x27;算子 / 计算图拥有&#x27;, trigger: &#x27;distributed linear forward / backward&#x27;, wait: &#x27;下游消费 activation 前&#x27;,
          note: &#x27;即使 profiler 中 GEMM 和 NCCL 是两个 kernel，它仍是算子语义的一部分。RowParallelLinear 的 local partial 必须求和才能定义该层输出。&#x27;,
          lanes: {
            model: [[&#x27;LN / local GEMM&#x27;, &#x27;[S,B,H] × W_shard&#x27;, &#x27;计算局部分片&#x27;], [&#x27;RowParallel 输出&#x27;, &#x27;[S,B,H] partial&#x27;, &#x27;需要跨 TP 求和&#x27;], [&#x27;Residual&#x27;, &#x27;[S,B,H]&#x27;, &#x27;消费通信结果&#x27;]],
            framework: [[&#x27;Process group&#x27;, &#x27;TP group 已建立&#x27;, &#x27;初始化阶段完成&#x27;], [&#x27;Autograd mapping&#x27;, &#x27;forward / backward 对偶&#x27;, &#x27;反向 collective 自动触发&#x27;]],
            library: [[&#x27;enqueue AllReduce&#x27;, &#x27;SUM [S,B,H]&#x27;, &#x27;host 快速返回&#x27;], [&#x27;Work on comm stream&#x27;, &#x27;chunked collective&#x27;, &#x27;consumer 前 event/wait&#x27;]],
            fabric: [[&#x27;GPU peer path&#x27;, &#x27;NVLink / NVSwitch / PCIe&#x27;, &#x27;按 topology 选 ring/tree/channel&#x27;]]
          }
        },
        moe: {
          label: &#x27;MoE Expert Parallel&#x27;, verdict: &#x27;算子 / MoE dispatcher 拥有&#x27;, trigger: &#x27;router 产生 Top-k 后&#x27;, wait: &#x27;expert GEMM 读取 dispatched token 前&#x27;,
          note: &#x27;可变 split 的 AllToAllv 常先交换每个目的 rank 的 token count；这是每次路由的 metadata 协调，不是重新建立 communicator。&#x27;,
          lanes: {
            model: [[&#x27;Router + Top-k&#x27;, &#x27;[T,E] → ids/weights [T,k]&#x27;, &#x27;复制并 permute route&#x27;], [&#x27;Dispatch A2A&#x27;, &#x27;[T·k,H] → ragged [M_recv,H]&#x27;, &#x27;发送到 expert owner&#x27;], [&#x27;Grouped GEMM&#x27;, &#x27;[nₑ,H] → [nₑ,H]&#x27;, &#x27;本地专家计算&#x27;], [&#x27;Combine A2A&#x27;, &#x27;ragged → token owner&#x27;, &#x27;反向 permute + weighted sum&#x27;]],
            framework: [[&#x27;EP group / placement&#x27;, &#x27;rank ↔ expert mapping&#x27;, &#x27;训练启动时创建&#x27;], [&#x27;Capacity / balance&#x27;, &#x27;split sizes&#x27;, &#x27;dispatcher 管理&#x27;]],
            library: [[&#x27;AllToAll(v)&#x27;, &#x27;counts + payload&#x27;, &#x27;分块可与 expert GEMM overlap&#x27;]],
            fabric: [[&#x27;Bisection traffic&#x27;, &#x27;all peers exchange&#x27;, &#x27;最慢 / 最大 recv rank 决定尾延迟&#x27;]]
          }
        },
        ddp: {
          label: &#x27;DDP 梯度同步&#x27;, verdict: &#x27;框架 reducer hook 触发&#x27;, trigger: &#x27;autograd 标记一个 grad bucket ready&#x27;, wait: &#x27;backward 尾部 finalize，返回前&#x27;,
          note: &#x27;AllReduce 与更早层 backward 可以重叠。optimizer.step 通常拿到的是 backward 已完成同步的梯度；no_sync 会把同步推迟到最后一个 accumulation microbatch。&#x27;,
          lanes: {
            model: [[&#x27;Layer N backward&#x27;, &#x27;dW ready&#x27;, &#x27;模型层只计算梯度&#x27;], [&#x27;Layer N−1 backward&#x27;, &#x27;继续计算&#x27;, &#x27;与 bucket 0 通信重叠&#x27;]],
            framework: [[&#x27;AccumulateGrad hook&#x27;, &#x27;param ready&#x27;, &#x27;bucket 全 ready 后 launch&#x27;], [&#x27;Reducer finalize&#x27;, &#x27;wait bucket futures&#x27;, &#x27;写回 grad views&#x27;], [&#x27;backward returns&#x27;, &#x27;grads ready&#x27;, &#x27;optimizer 可执行&#x27;]],
            library: [[&#x27;Bucket AllReduce&#x27;, &#x27;flat grad bucket [N₀]&#x27;, &#x27;异步 SUM / AVG&#x27;]],
            fabric: [[&#x27;Ring / Tree&#x27;, &#x27;按 size/topology 自动选&#x27;, &#x27;多个 bucket 可排队&#x27;]]
          }
        },
        fsdp: {
          label: &#x27;FSDP / ZeRO-3&#x27;, verdict: &#x27;框架 execution-order hooks 触发&#x27;, trigger: &#x27;wrapped unit pre-forward / pre-backward&#x27;, wait: &#x27;module 使用 full param 前&#x27;,
          note: &#x27;同一个 AllGather 在这里属于框架，因为 module.forward 本身无需知道参数是分片的。Prefetch 只是提前触发，归属没有改变。&#x27;,
          lanes: {
            model: [[&#x27;Module forward&#x27;, &#x27;needs full flat param [P]&#x27;, &#x27;层代码保持普通写法&#x27;], [&#x27;Module backward&#x27;, &#x27;full grad [P]&#x27;, &#x27;本地计算&#x27;]],
            framework: [[&#x27;Pre-hook AllGather&#x27;, &#x27;[P/world] → [P]&#x27;, &#x27;JIT materialize&#x27;], [&#x27;Post-forward reshard&#x27;, &#x27;free / retain full param&#x27;, &#x27;策略可配置&#x27;], [&#x27;Post-backward ReduceScatter&#x27;, &#x27;[P] → [P/world]&#x27;, &#x27;optimizer 更新 local shard&#x27;]],
            library: [[&#x27;AG / RS enqueue&#x27;, &#x27;prefetch + async Work&#x27;, &#x27;依 execution order 排程&#x27;]],
            fabric: [[&#x27;Hierarchical path&#x27;, &#x27;intra-node + inter-node&#x27;, &#x27;wrap granularity影响消息大小&#x27;]]
          }
        },
        pipeline: {
          label: &#x27;Pipeline P2P&#x27;, verdict: &#x27;Pipeline scheduler / Runtime 拥有&#x27;, trigger: &#x27;microbatch schedule 到达 stage 边界&#x27;, wait: &#x27;stage 读取 activation / gradient 前&#x27;,
          note: &#x27;有些实现把 send/recv 包装成 autograd node，但语义仍由 1F1B、interleaving 等 stage scheduler 决定。&#x27;,

        small:{label:&#x27;很多小消息&#x27;,title:&#x27;启动延迟 α / launch bound&#x27;,symptom:&#x27;消息很小但 collective 次数多，GPU/CPU launch 与每轮同步占主导。&#x27;,actions:[&#x27;融合/flatten 小 tensor，调 DDP/FSDP bucket，但不要大到推迟首包。&#x27;,&#x27;用 GroupStart/End 或 batch P2P，一次 enqueue 多个相关 operation。&#x27;,&#x27;复用 communicator、endpoint 和 memory registration；预热后再测。&#x27;,&#x27;考虑 Tree / recursive doubling / LL 类低延迟算法；先 profile 再强制。&#x27;],risk:&#x27;代价：融合需要额外 buffer，并增加等待凑桶的时间。&#x27;},

        exposed:{label:&#x27;通信尾巴暴露&#x27;,title:&#x27;Overlap 不足 / critical-path bound&#x27;,symptom:&#x27;通信本身可能已经很快，但下游在等待它，step 尾部出现明显空洞。&#x27;,actions:[&#x27;DDP 按 grad ready 顺序分桶，让早期 bucket 与后续 backward 重叠。&#x27;,&#x27;FSDP/ZeRO 提前 AllGather 下一个 unit，backward prefetch 当前之后的 unit。&#x27;,&#x27;TP/MoE 用独立 comm stream、CUDA event、分块 dispatch，与 dgrad/wgrad 或 expert GEMM overlap。&#x27;,&#x27;Pipeline 增 microbatch 或 interleaving，缩小 bubble；在真正 consumer 前再 wait。&#x27;],risk:&#x27;Overlap 只减少 exposed time，不减少 wire time；并发过多会争 HBM、SM、PCIe/NVLink。&#x27;},
        cross:{label:&#x27;跨机慢&#x27;,title:&#x27;跨层级与网络拥塞&#x27;,symptom:&#x27;单机 NCCL 很快，跨机后延迟和 tail 急剧增大。&#x27;,actions:[&#x27;把 TP/EP 等高频通信 group 尽量放在 NVLink/NVSwitch 域内，DP/PP 再跨机。&#x27;,&#x27;用 hierarchical collective：节点内 reduce/RS → 节点间 shard collective → 节点内 broadcast/AG。&#x27;,&#x27;检查 GDR、NIC rail、交换机 bisection、oversubscription、MTU 与 NUMA。&#x27;,&#x27;RoCE 的 PFC/ECN/DCQCN/QoS/隔离流量需要网络侧共同配置。&#x27;],risk:&#x27;代价：层级算法和 rank mapping 与拓扑强绑定；换集群后需要重新测。&#x27;},
        moe:{label:&#x27;MoE AllToAll&#x27;,title:&#x27;路由不均与 bisection bottleneck&#x27;,symptom:&#x27;平均流量不大，但最大 expert/rank recv 决定全局完成时间。&#x27;,actions:[&#x27;改善 router balance/capacity，监控每 expert 的 nₑ、drop 和最大 recv，不只看平均。&#x27;,&#x27;拓扑感知 expert placement，把高频专家/EP group 尽量放同节点。&#x27;,&#x27;分块 dispatch、fused permute、grouped GEMM、shared-expert overlap。&#x27;,&#x27;采用 hierarchical A2A 或专用低延迟 dispatch；decode 小包与 prefill 大包用不同模式。&#x27;],risk:&#x27;代价：限制 top-k/capacity 或 locality-aware routing 可能影响模型质量与负载分布。&#x27;},
        barrier:{label:&#x27;Barrier 很慢&#x27;,title:&#x27;Straggler / 隐式同步&#x27;,symptom:&#x27;Barrier 占时高，但真正原因常是前序计算、数据加载或通信负载不均。&#x27;,actions:[&#x27;先画每 rank 到达时间，区分 arrival skew 与 barrier token 协议时间。&#x27;,&#x27;删除热路径中非必要 barrier、host sync、tensor.item() 与全局日志聚合。&#x27;,&#x27;用 monitored_barrier/timeout/debug 找未到达 rank；不要只调 collective 参数。&#x27;,&#x27;修复数据、专家、microbatch 或网络负载不均。&#x27;],risk:&#x27;Barrier 前后粗粒度计时会把其他 rank 的迟到错误归因给通信库。&#x27;},
        decode:{label:&#x27;Decode 小 batch&#x27;,title:&#x27;小包延迟与并行度过高&#x27;,symptom:&#x27;每步 Q=1、token 很少，TP/EP collective payload 小，α 与同步主导。&#x27;,actions:[&#x27;降低跨机 TP/EP group，优先本机高速域；评估复制 KV/expert 换通信。&#x27;,&#x27;continuous batching 合并请求，提高每次 collective 的有效 payload。&#x27;,&#x27;避免每 token 的 host round-trip、全局 barrier 和小 tensor gather。&#x27;,&#x27;KV/request/expert locality-aware placement；prefill→decode cache 传输批量化。&#x27;],risk:&#x27;减少并行度会增加单卡显存；批量增大可能提高吞吐但恶化单请求排队延迟。&#x27;}
      };

      const laneNames = {model:&#x27;模型 / 算子&#x27;,framework:&#x27;框架 / Runtime&#x27;,library:&#x27;通信库&#x27;,fabric:&#x27;Transport / Fabric&#x27;};
      const laneClasses = {model:&#x27;model&#x27;,framework:&#x27;framework&#x27;,library:&#x27;library&#x27;,fabric:&#x27;fabric&#x27;};

      function normalizeState() {
        if (![&#x27;ownership&#x27;,&#x27;collectives&#x27;,&#x27;protocol&#x27;,&#x27;optimize&#x27;].includes(state.view)) state.view = &#x27;ownership&#x27;;
        if (!scenarios[state.scenario]) state.scenario = &#x27;tp&#x27;;
        if (!collectives[state.collective]) state.collective = &#x27;allreduce&#x27;;
        if (!protocols[state.protocol]) state.protocol = &#x27;nccl&#x27;;
        if (!bottlenecks[state.bottleneck]) state.bottleneck = &#x27;exposed&#x27;;

      function persist() {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({

      }

      function makeButtons(target, data, selected, handler) {
        target.innerHTML = Object.entries(data).map(([key,value]) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn ${key===selected?&#x27;btn-primary&#x27;:&#x27;&#x27;}&quot; aria-pressed=&quot;${key===selected}&quot; data-key=&quot;${key}&quot;&gt;${value.label}&lt;/button&gt;`).join(&#x27;&#x27;);

      }

      function renderView() {
        normalizeState();
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; {
          const active = button.dataset.view === state.view;
          button.className = active ? &#x27;btn btn-primary&#x27; : &#x27;btn&#x27;;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        });
        root.querySelectorAll(&#x27;.view&#x27;).forEach(view =&gt; view.hidden = view.id !== `view-${state.view}`);
        if (state.view === &#x27;ownership&#x27;) renderOwnership();
        if (state.view === &#x27;collectives&#x27;) renderCollective();
        if (state.view === &#x27;protocol&#x27;) renderProtocol();
        if (state.view === &#x27;optimize&#x27;) renderOptimize();
      }

      function renderOwnership() {
        makeButtons(root.querySelector(&#x27;#scenario-controls&#x27;), scenarios, state.scenario, key =&gt; {state.scenario=key;renderOwnership();persist();});
        const item = scenarios[state.scenario];
        root.querySelector(&#x27;#owner-verdict&#x27;).textContent = item.verdict;
        root.querySelector(&#x27;#owner-trigger&#x27;).textContent = item.trigger;
        root.querySelector(&#x27;#owner-wait&#x27;).textContent = item.wait;
        root.querySelector(&#x27;#owner-note&#x27;).textContent = item.note;
        root.querySelector(&#x27;#owner-lanes&#x27;).innerHTML = Object.entries(item.lanes).map(([lane,events]) =&gt; `
          &lt;div class=&quot;lane ${laneClasses[lane]}&quot;&gt;
            &lt;div class=&quot;lane-label&quot;&gt;&lt;span class=&quot;lane-dot&quot;&gt;&lt;/span&gt;${laneNames[lane]}&lt;/div&gt;
            &lt;div class=&quot;lane-events&quot;&gt;${events.map(([title,shape,note]) =&gt; `&lt;div class=&quot;event&quot;&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;code&gt;${shape}&lt;/code&gt;&lt;small&gt;${note}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function renderCollective() {
        makeButtons(root.querySelector(&#x27;#collective-controls&#x27;), collectives, state.collective, key =&gt; {state.collective=key;state.stage=0;renderCollective();persist();});
        const item = collectives[state.collective];
        if (state.stage &gt;= item.stages.length) state.stage = 0;
        const stage = item.stages[state.stage];
        root.querySelector(&#x27;#collective-title&#x27;).textContent = item.title;
        root.querySelector(&#x27;#rank-grid&#x27;).innerHTML = stage.ranks.map((chunks,index) =&gt; `&lt;div class=&quot;rank-box&quot;&gt;&lt;div class=&quot;rank-title&quot;&gt;Rank ${index}&lt;/div&gt;&lt;div class=&quot;chunks&quot;&gt;${chunks.length?chunks.map(chunk=&gt;`&lt;span class=&quot;chunk&quot;&gt;${chunk}&lt;/span&gt;`).join(&#x27;&#x27;):&#x27;&lt;span class=&quot;muted&quot;&gt;empty&lt;/span&gt;&#x27;}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#transfer-title&#x27;).textContent = stage.name;
        root.querySelector(&#x27;#transfer-note&#x27;).textContent = stage.note;
        root.querySelector(&#x27;#stage-controls&#x27;).innerHTML = item.stages.map((s,index)=&gt;`&lt;button type=&quot;button&quot; class=&quot;btn ${index===state.stage?&#x27;btn-primary&#x27;:&#x27;btn-ghost&#x27;}&quot; aria-pressed=&quot;${index===state.stage}&quot; data-stage=&quot;${index}&quot;&gt;${index+1} · ${s.name}&lt;/button&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{state.stage=Number(button.dataset.stage);renderCollective();persist();}));
        const details = [[&#x27;输入&#x27;,item.input],[&#x27;输出&#x27;,item.output],[&#x27;轮次&#x27;,item.rounds],[&#x27;网络量&#x27;,item.bytes],[&#x27;理想成本&#x27;,item.cost],[&#x27;典型用途&#x27;,item.use]];
        root.querySelector(&#x27;#collective-details&#x27;).innerHTML = details.map(([label,value])=&gt;`&lt;div class=&quot;detail-row&quot;&gt;&lt;strong&gt;${label}&lt;/strong&gt;&lt;div&gt;${value}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);

      function renderProtocol() {
        makeButtons(root.querySelector(&#x27;#protocol-controls&#x27;), protocols, state.protocol, key =&gt; {state.protocol=key;renderProtocol();persist();});
        const item = protocols[state.protocol];
        const phases = [[&#x27;bootstrap&#x27;,&#x27;初始化 / 握手&#x27;,item.bootstrap],[&#x27;transfer&#x27;,&#x27;每次传输&#x27;,item.transfer],[&#x27;verify&#x27;,&#x27;完成 / 验证&#x27;,item.verify]];
        root.querySelector(&#x27;#protocol-map&#x27;).innerHTML = phases.map(([kind,title,steps])=&gt;`&lt;div class=&quot;phase-column ${kind}&quot;&gt;&lt;div class=&quot;phase-title&quot;&gt;&lt;span class=&quot;swatch ${kind}&quot;&gt;&lt;/span&gt;${title}&lt;/div&gt;&lt;div class=&quot;step-list&quot;&gt;${steps.map(([name,note])=&gt;`&lt;div class=&quot;protocol-step&quot;&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;span&gt;${note}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#payload-path&#x27;).innerHTML = item.paths.map(path=&gt;`&lt;div class=&quot;path-group&quot;&gt;&lt;div class=&quot;path-label&quot;&gt;${path.label}&lt;/div&gt;&lt;div class=&quot;path-row&quot;&gt;${path.hops.map(hop=&gt;`&lt;div class=&quot;path-hop&quot;&gt;${hop}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        const validation = [
          [&#x27;传输完整性&#x27;,&#x27;CRC/ECC、sequence、ACK/retry、CQ status：证明 packet / transaction 状态。&#x27;],
          [&#x27;协议一致性&#x27;,&#x27;group、peer/tag、顺序、count/dtype/root、buffer range：错配仍可能 hang/timeout。&#x27;],
          [&#x27;数值正确性&#x27;,&#x27;默认不做端到端 tensor checksum。用可解析 pattern、reference、hash/norm 与 rtol/atol 验证。&#x27;]
        ];
        root.querySelector(&#x27;#validation-grid&#x27;).innerHTML = validation.map(([title,note])=&gt;`&lt;div class=&quot;validation-item&quot;&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;div class=&quot;text-small muted&quot;&gt;${note}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function renderOptimize() {
        makeButtons(root.querySelector(&#x27;#bottleneck-controls&#x27;), bottlenecks, state.bottleneck, key =&gt; {state.bottleneck=key;renderOptimize();persist();});
        const item = bottlenecks[state.bottleneck];
        root.querySelector(&#x27;#bottleneck-title&#x27;).textContent = item.title;
        root.querySelector(&#x27;#bottleneck-symptom&#x27;).textContent = item.symptom;
        root.querySelector(&#x27;#action-list&#x27;).innerHTML = item.actions.map((action,index)=&gt;`&lt;div class=&quot;action-item&quot;&gt;&lt;div class=&quot;action-index&quot;&gt;${index+1}&lt;/div&gt;&lt;div&gt;${action}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#bottleneck-risk&#x27;).textContent = item.risk;
      }

      root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {state.view=button.dataset.view;renderView();persist();}));
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState &amp;&amp; event.detail.globals.widgetState.privateContent;
        if (!next) return;
        Object.assign(state,next);
        normalizeState();
        renderView();
      });
      renderView();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

  const getTooltip = () =&gt; {

      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;

        }
      });

    const content = getContent(trigger);

    }

    floating.style.visibility = &quot;hidden&quot;;

    });

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
