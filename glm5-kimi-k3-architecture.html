    postToHost(&quot;height&quot;, {

    &quot;message&quot;,
    (event) =&gt; {

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

        !isArray(ports) ||
        ports.length !== 1

      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;model-architecture-explorer&#x27;);
      const saved = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.privateContent;
      const initialModel = saved &amp;&amp; saved.model === &#x27;kimi&#x27; ? &#x27;kimi&#x27; : &#x27;glm&#x27;;
      const initialLayers = saved &amp;&amp; saved.layers ? saved.layers : {};
      const state = {
        model: initialModel,
        selected: {
          glm: Number.isInteger(initialLayers.glm) ? initialLayers.glm : 1,
          kimi: Number.isInteger(initialLayers.kimi) ? initialLayers.kimi : 1
        },
        example: Boolean(saved &amp;&amp; saved.example),
        phase: saved &amp;&amp; saved.phase === &#x27;decode&#x27; ? &#x27;decode&#x27; : &#x27;prefill&#x27;
      };

      const models = {
        glm: {
          name: &#x27;GLM-5&#x27;,
          layers: 78,
          width: 6144,
          pattern: &#x27;L1–3：DSA/MLA + Dense；L4–78：DSA/MLA + MoE。主干后另有 1 个共享参数 MTP block。&#x27;,
          note: &#x27;每个格子的左线都表示 DSA：主计算仍是 MLA，索引器先从历史 token 中选 Top-2048，再执行稀疏注意力。&#x27;,
          caveat: &#x27;层数按官方发布 checkpoint：78 个主干 block + 1 个 MTP block。技术报告正文曾写 80 层，但附录、config 与权重索引均支持这里的口径。&#x27;,
          sources: [
            [&#x27;官方 config&#x27;, &#x27;https://huggingface.co/zai-org/GLM-5/blob/main/config.json&#x27;],
            [&#x27;技术报告&#x27;, &#x27;https://arxiv.org/html/2602.15763&#x27;],
            [&#x27;Transformers 实现&#x27;, &#x27;https://github.com/huggingface/transformers/blob/e24eb546fefd0dcfe0125232a9b45c220823b157/src/transformers/models/glm_moe_dsa/modeling_glm_moe_dsa.py&#x27;]
          ],
          jumps: [
            { label: &#x27;L1 · DSA/MLA + Dense&#x27;, layer: 1 },
            { label: &#x27;L4 · DSA/MLA + MoE&#x27;, layer: 4 },
            { label: &#x27;L78 · 最后主干层&#x27;, layer: 78 }
          ],
          getLayer(layer) {
            return { attention: &#x27;dsa&#x27;, ffn: layer &lt;= 3 ? &#x27;dense&#x27; : &#x27;moe&#x27; };
          }
        },
        kimi: {
          name: &#x27;Kimi K3&#x27;,
          layers: 93,
          width: 7168,
          pattern: &#x27;23 × [KDA, KDA, KDA, Gated MLA] 覆盖 L1–92，再追加 L93 Gated MLA。仅 L1 是 Dense。&#x27;,
          note: &#x27;精确组合：1 层 KDA+Dense，68 层 KDA+LatentMoE，24 层 MLA+LatentMoE。AttnRes 以 12 层分组，并在组内各层持续聚合深度信息。&#x27;,
          caveat: &#x27;K3 的 MLA 使用 NoPE。配置字段名仍含 qk_rope_head_dim=64，但官方实现不对这 64 维执行 RoPE。&#x27;,
          sources: [
            [&#x27;官方模型卡&#x27;, &#x27;https://github.com/MoonshotAI/Kimi-K3&#x27;],
            [&#x27;技术报告&#x27;, &#x27;https://arxiv.org/html/2607.24653&#x27;],
            [&#x27;官方 config&#x27;, &#x27;https://huggingface.co/moonshotai/Kimi-K3/blob/main/config.json&#x27;],
            [&#x27;官方实现&#x27;, &#x27;https://huggingface.co/moonshotai/Kimi-K3/blob/main/modeling_kimi_linear.py&#x27;]
          ],
          jumps: [
            { label: &#x27;L1 · KDA + Dense&#x27;, layer: 1 },
            { label: &#x27;L2 · KDA + LatentMoE&#x27;, layer: 2 },
            { label: &#x27;L4 · MLA + LatentMoE&#x27;, layer: 4 },
            { label: &#x27;L93 · 追加 MLA&#x27;, layer: 93 }
          ],
          getLayer(layer) {
            const attention = layer === 93 || layer % 4 === 0 ? &#x27;mla&#x27; : &#x27;kda&#x27;;
            return { attention, ffn: layer === 1 ? &#x27;dense&#x27; : &#x27;latentmoe&#x27; };
          }
        }
      };

      const pipelines = {
        glm: {
          dsa: {
            title: &#x27;DSA 注意力（MLA 主干 + 稀疏索引）&#x27;,
            mark: &#x27;mla&#x27;,
            steps: [
              [&#x27;RMSNorm&#x27;, &#x27;[B,T,6144]&#x27;, &#x27;pre-norm，shape 不变&#x27;],
              [&#x27;Q 低秩投影&#x27;, &#x27;[B,T,2048] → [B,T,64,256]&#x27;, &#x27;每头 192 NoPE + 64 RoPE&#x27;],
              [&#x27;kv_a latent/cache&#x27;, &#x27;[B,S,512] + [B,S,64]&#x27;, &#x27;latent KV + RoPE key；cache 为 576/token/layer&#x27;],
              [&#x27;DSA 索引器&#x27;, &#x27;[B,T,32,128] → [B,T,min(2048,T)]&#x27;, &#x27;汇总 32 个索引 head，选 Top-2048 历史位置&#x27;],
              [&#x27;w_kc + concat&#x27;, &#x27;[B,Q,64,192] → [B,Q,64,512] + [B,Q,64,64] → [B,Q,64,576]&#x27;, &#x27;weight-absorption 对齐压缩 KV&#x27;],
              [&#x27;稀疏 MLA latent context&#x27;, &#x27;[B,Q,64,512]&#x27;, &#x27;只对被索引位置执行 MLA 主注意力&#x27;],
              [&#x27;w_vc + O_proj&#x27;, &#x27;[B,Q,64,512] → [B,Q,64,256] → [B,Q,16384] → [B,Q,6144]&#x27;, &#x27;恢复 V head 后回到 residual stream&#x27;],
              [&#x27;残差相加&#x27;, &#x27;[B,T,6144]&#x27;, &#x27;层宽保持不变&#x27;]
            ]
          },
          dense: {
            title: &#x27;Dense SwiGLU FFN&#x27;,
            mark: &#x27;dense&#x27;,
            steps: [
              [&#x27;RMSNorm&#x27;, &#x27;[B,T,6144]&#x27;, &#x27;pre-norm&#x27;],
              [&#x27;Gate / Up&#x27;, &#x27;2 × [B,T,12288]&#x27;, &#x27;两路独立线性投影&#x27;],
              [&#x27;SiLU(gate) ⊙ up&#x27;, &#x27;[B,T,12288]&#x27;, &#x27;逐元素门控&#x27;],
              [&#x27;Down_proj&#x27;, &#x27;[B,T,12288] → [B,T,6144]&#x27;, &#x27;回到模型宽度&#x27;],
              [&#x27;残差相加&#x27;, &#x27;[B,T,6144]&#x27;, &#x27;仅 L1–3 使用&#x27;]
            ]
          },
          moe: {
            title: &#x27;MoE SwiGLU FFN&#x27;,
            mark: &#x27;moe&#x27;,
            steps: [
              [&#x27;Router&#x27;, &#x27;[N,6144] → [N,256] → [N,8]&#x27;, &#x27;Sigmoid 路由，Top-8 routed experts&#x27;],
              [&#x27;Token dispatch&#x27;, &#x27;[N,8,6144] → ragged [nₑ,6144]&#x27;, &#x27;按专家重排；nₑ 每个专家不同&#x27;],
              [&#x27;8× Routed experts&#x27;, &#x27;[nₑ,6144] → 2×[nₑ,2048] → [nₑ,6144]&#x27;, &#x27;每个专家内部是 gate/up 双分支 SwiGLU&#x27;],
              [&#x27;1× Shared expert&#x27;, &#x27;[N,6144] → 2×[N,2048] → [N,6144]&#x27;, &#x27;所有 token 始终经过&#x27;],
              [&#x27;加权聚合 + 残差&#x27;, &#x27;[B,T,6144]&#x27;, &#x27;8 路 routed 加权和 + shared&#x27;]
            ]
          }
        },

            &lt;code&gt;${displayFlowShape(shape)}&lt;/code&gt;
            &lt;span class=&quot;flow-node-note text-small&quot;&gt;${note}&lt;/span&gt;
          &lt;/div&gt;
        `).join(&#x27;&#x27;);
      }

      function renderFlowColumn(target, flowSpec) {
        target.innerHTML = `
          &lt;div class=&quot;flow-lane-note text-small&quot;&gt;${flowSpec.intro}&lt;/div&gt;
          ${flowSpec.lanes.map((lane) =&gt; `
            &lt;div class=&quot;flow-lane&quot;&gt;
              &lt;div class=&quot;flow-lane-heading&quot;&gt;&lt;span class=&quot;mini-mark ${lane.accent}&quot;&gt;&lt;/span&gt;${lane.label}&lt;/div&gt;
              &lt;div class=&quot;flow-lane-note text-small&quot;&gt;${lane.note}&lt;/div&gt;
              &lt;div class=&quot;flow-chain&quot;&gt;${renderFlowChain(lane.steps, lane.accent)}&lt;/div&gt;
            &lt;/div&gt;
          `).join(&#x27;&#x27;)}
          &lt;div class=&quot;flow-merge&quot;&gt;
            &lt;div class=&quot;flow-lane-heading&quot;&gt;&lt;span class=&quot;mini-mark stream&quot;&gt;&lt;/span&gt;合流 / 输出&lt;/div&gt;
            &lt;div class=&quot;flow-chain&quot;&gt;${renderFlowChain(flowSpec.merge, &#x27;stream&#x27;)}&lt;/div&gt;
          &lt;/div&gt;
        `;
      }

      function renderFlow() {
        const model = models[state.model];
        const layer = state.selected[state.model];
        const spec = model.getLayer(layer);
        const attn = pipelines[state.model][spec.attention];
        const ffn = pipelines[state.model][spec.ffn];
        const d = model.width;
        const isKimi = state.model === &#x27;kimi&#x27;;
        const qShape = &#x27;[B,Q,&#x27; + d + &#x27;]&#x27;;
        const mainline = [
          {
            title: &#x27;1 · 输入 residual stream&#x27;,
            shape: qShape,
            note: state.phase === &#x27;decode&#x27; ? &#x27;当前步只有 Q=1 个新 token；历史 token 在 cache/state 中。&#x27; : &#x27;每个 token 是 d 维向量；这是层与层之间的接口。&#x27;,
            kind: &#x27;stream&#x27;
          },
          {
            title: &#x27;2 · Attention 前&#x27;,
            shape: isKimi ? `[N_q,M,${d}] → ${qShape}` : qShape,
            note: isKimi ? (layer === 1 ? &#x27;L1 是 plain RMSNorm；后续层先做 AttnRes 组内聚合。&#x27; : &#x27;AttnRes 组内聚合，再做 RMSNorm。&#x27;) : &#x27;RMSNorm 后分成 Q、K/V 与索引器分支。&#x27;,
            kind: &#x27;attention&#x27;
          },
          {
            title: `3 · ${attn.title}`,
            shape: `${qShape} → ${qShape}`,
            note: &#x27;临时张量在下方展开，最后经过 O_proj 回到主线。&#x27;,
            kind: &#x27;join&#x27;
          },
          {
            title: &#x27;4 · Attention 输出合流&#x27;,
            shape: qShape,
            note: isKimi ? &#x27;MLP-side AttnRes 用 bank + prefix + score/softmax/RMSNorm 聚合。&#x27; : &#x27;attention output 与 residual 相加，再进入 FFN 前的 RMSNorm。&#x27;,
            kind: &#x27;join&#x27;
          },
          {
            title: `5 · ${ffn.title} → 层输出`,
            shape: `${qShape} → ${qShape}`,
            note: isKimi ? &#x27;FFN 后更新当前 AttnRes prefix，再送入下一层。&#x27; : &#x27;FFN 后残差相加，送入下一层。&#x27;,
            kind: &#x27;ffn&#x27;
          }
        ];

        root.querySelector(&#x27;#flow-caption&#x27;).textContent = `${model.name} · 第 ${layer} 层 · ${labels[spec.attention]} + ${labels[spec.ffn]} · ${state.phase === &#x27;decode&#x27; ? &#x27;Decode：Q=1，S=cache&#x27; : &#x27;Prefill：Q=S=T&#x27;}。主线追踪 residual stream，分支追踪临时张量。`;
        root.querySelector(&#x27;#flow-mainline&#x27;).setAttribute(&#x27;aria-label&#x27;, `${model.name} 第 ${layer} 层的输入到输出数据流`);
        root.querySelector(&#x27;#flow-mainline&#x27;).innerHTML = mainline.map((stage) =&gt; `
          &lt;div class=&quot;flow-stage&quot; data-kind=&quot;${stage.kind}&quot;&gt;
            &lt;div class=&quot;flow-stage-heading&quot;&gt;&lt;span class=&quot;flow-stage-index&quot;&gt;${stage.title.split(&#x27; · &#x27;)[0]}&lt;/span&gt;&lt;strong&gt;${stage.title.split(&#x27; · &#x27;).slice(1).join(&#x27; · &#x27;)}&lt;/strong&gt;&lt;/div&gt;
            &lt;code&gt;${displayFlowShape(stage.shape)}&lt;/code&gt;
            &lt;span class=&quot;flow-stage-note text-small&quot;&gt;${stage.note}&lt;/span&gt;
          &lt;/div&gt;
        `).join(&#x27;&#x27;);

        renderFlowColumn(root.querySelector(&#x27;#flow-attention-map&#x27;), flowSpecs[state.model][spec.attention]);
        renderFlowColumn(root.querySelector(&#x27;#flow-ffn-map&#x27;), flowSpecs[state.model][spec.ffn]);

        const stateItems = state.model === &#x27;glm&#x27;
          ? [
              [&#x27;state-attention&#x27;, &#x27;MLA latent KV cache&#x27;, state.phase === &#x27;decode&#x27; ? &#x27;[B,S,576]；按历史长度增长&#x27; : &#x27;[B,T,576]；512 latent + 64 RoPE&#x27;],
              [&#x27;state-index&#x27;, &#x27;DSA indexer K cache&#x27;, state.phase === &#x27;decode&#x27; ? &#x27;[B,S,128]；供 [B,1,S] 打分&#x27; : &#x27;[B,T,128]；供 [B,T,T] 打分&#x27;],
              [&#x27;state-routing&#x27;, spec.ffn === &#x27;moe&#x27; ? &#x27;MoE route metadata&#x27; : &#x27;Dense path&#x27;, spec.ffn === &#x27;moe&#x27; ? &#x27;[N_q,8] ids + weights；dispatch 后每专家为 ragged nₑ&#x27; : &#x27;no expert routing；单一路径&#x27;]
            ]
          : spec.attention === &#x27;kda&#x27;
            ? [
                [&#x27;state-attention&#x27;, &#x27;KDA recurrent state&#x27;, &#x27;[B,96,128,128]；decode 时固定大小&#x27;],
                [&#x27;state-index&#x27;, &#x27;AttnRes prefix bank&#x27;, &#x27;[N_q,M,7168]；组内聚合与写回&#x27;],
                [&#x27;state-routing&#x27;, spec.ffn === &#x27;latentmoe&#x27; ? &#x27;LatentMoE route metadata&#x27; : &#x27;Dense path&#x27;, spec.ffn === &#x27;latentmoe&#x27; ? &#x27;[N_q,16] ids + weights；Σnₑ=16N_q&#x27; : &#x27;no expert routing；单一路径&#x27;]
              ]
            : [
                [&#x27;state-attention&#x27;, &#x27;MLA latent KV cache&#x27;, state.phase === &#x27;decode&#x27; ? &#x27;[B,S,576]；NoPE，按历史长度增长&#x27; : &#x27;[B,T,576]；512 latent + 64 shared key&#x27;],
                [&#x27;state-index&#x27;, &#x27;AttnRes prefix bank&#x27;, &#x27;[N_q,M,7168]；组内聚合与写回&#x27;],
                [&#x27;state-routing&#x27;, spec.ffn === &#x27;latentmoe&#x27; ? &#x27;LatentMoE route metadata&#x27; : &#x27;Dense path&#x27;, spec.ffn === &#x27;latentmoe&#x27; ? &#x27;[N_q,16] ids + weights；Σnₑ=16N_q&#x27; : &#x27;no expert routing；单一路径&#x27;]

        root.querySelector(&#x27;#flow-state-items&#x27;).innerHTML = stateItems.map(([kind, title, shape]) =&gt; `
          &lt;div class=&quot;flow-state-item ${kind}&quot;&gt;

            &lt;code&gt;${displayFlowShape(shape)}&lt;/code&gt;
          &lt;/div&gt;
        `).join(&#x27;&#x27;);

        const shapeNote = state.model === &#x27;kimi&#x27; &amp;&amp; spec.attention === &#x27;kda&#x27;
          ? &#x27;KDA 的关键信息：Prefill 沿 S/T 扫描 recurrent state；Decode 每次 Q=1，只更新固定大小的 state，不会产生 [B,H,T,T] 分数矩阵。&#x27;
          : state.model === &#x27;glm&#x27; &amp;&amp; spec.attention === &#x27;dsa&#x27;
            ? &#x27;DSA 的关键信息：Indexer 先用 [B,Q,S] 分数选 K=min(2048,S) 个历史位置，主 MLA 只在这些位置上计算。&#x27;
            : spec.ffn === &#x27;moe&#x27; || spec.ffn === &#x27;latentmoe&#x27;
              ? &#x27;MoE 的关键信息：N_q=B×Q 只在路由期间出现；专家内的 nₑ 是 ragged token 数，合流后恢复为 [B,Q,d]。&#x27;
              : &#x27;读图诀窍：主线的 d 始终回到模型宽度；中间维度只存在于当前分支。&#x27;;
        root.querySelector(&#x27;#flow-reading-note&#x27;).textContent = shapeNote;
      }

      function persist() {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({
          modelContent: { selectedModel: state.model, selectedLayer: state.selected[state.model] },
          privateContent: { model: state.model, layers: state.selected, example: state.example, phase: state.phase }
        }).catch(() =&gt; {});
      }

      function selectLayer(layer, shouldPersist = true) {
        state.selected[state.model] = layer;
        renderDetail();
        root.querySelectorAll(&#x27;.layer-cell&#x27;).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.layer) === layer));
        });
        if (shouldPersist) persist();
      }

      function renderDetail() {
        const model = models[state.model];
        const layer = state.selected[state.model];
        const spec = model.getLayer(layer);
        const attn = pipelines[state.model][spec.attention];
        const ffn = pipelines[state.model][spec.ffn];

        root.querySelector(&#x27;#detail-heading&#x27;).textContent = `${model.name} · 第 ${layer} 层`;
        root.querySelector(&#x27;#detail-subtitle&#x27;).textContent = `${labels[spec.attention]} + ${labels[spec.ffn]}`;
        root.querySelector(&#x27;#block-width&#x27;).textContent = `输入 / 输出 [B,Q,${model.width}]`;
        root.querySelector(&#x27;#attn-title&#x27;).textContent = attn.title;
        root.querySelector(&#x27;#attn-mark&#x27;).className = `mini-mark ${attn.mark}`;
        root.querySelector(&#x27;#ffn-title&#x27;).textContent = ffn.title;
        root.querySelector(&#x27;#ffn-mark&#x27;).className = `mini-mark ${ffn.mark}`;
        renderPipeline(root.querySelector(&#x27;#attn-pipeline&#x27;), attn);
        renderPipeline(root.querySelector(&#x27;#ffn-pipeline&#x27;), ffn);
        renderFlow();
      }

      function renderModel() {
        const model = models[state.model];
        root.querySelector(&#x27;#model-glm&#x27;).className = state.model === &#x27;glm&#x27; ? &#x27;btn btn-primary&#x27; : &#x27;btn&#x27;;
        root.querySelector(&#x27;#model-kimi&#x27;).className = state.model === &#x27;kimi&#x27; ? &#x27;btn btn-primary&#x27; : &#x27;btn&#x27;;
        root.querySelector(&#x27;#model-glm&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.model === &#x27;glm&#x27;));
        root.querySelector(&#x27;#model-kimi&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.model === &#x27;kimi&#x27;));
        root.querySelector(&#x27;#phase-prefill&#x27;).className = state.phase === &#x27;prefill&#x27; ? &#x27;btn btn-primary&#x27; : &#x27;btn&#x27;;
        root.querySelector(&#x27;#phase-decode&#x27;).className = state.phase === &#x27;decode&#x27; ? &#x27;btn btn-primary&#x27; : &#x27;btn&#x27;;
        root.querySelector(&#x27;#phase-prefill&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.phase === &#x27;prefill&#x27;));
        root.querySelector(&#x27;#phase-decode&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.phase === &#x27;decode&#x27;));
        root.querySelector(&#x27;#example-shape-label&#x27;).innerHTML = state.phase === &#x27;decode&#x27;
          ? &#x27;代入示例 &lt;code&gt;B=2, Q=1, S=cache&lt;/code&gt;&#x27;
          : &#x27;代入示例 &lt;code&gt;B=2, Q=S=4096&lt;/code&gt;&#x27;;
        root.querySelector(&#x27;#pattern-text&#x27;).textContent = model.pattern;
        root.querySelector(&#x27;#map-note&#x27;).textContent = model.note;
        root.querySelector(&#x27;#caveat&#x27;).textContent = model.caveat;
        root.querySelector(&#x27;#source-links&#x27;).innerHTML = model.sources.map(([label, href]) =&gt; `&lt;a href=&quot;${href}&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;${label}&lt;/a&gt;`).join(&#x27;&#x27;);

        root.querySelector(&#x27;#quick-jumps&#x27;).innerHTML = model.jumps.map((jump) =&gt; `
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-jump=&quot;${jump.layer}&quot;&gt;${jump.label}&lt;/button&gt;
        `).join(&#x27;&#x27;);

        root.querySelector(&#x27;#layer-map&#x27;).innerHTML = Array.from({ length: model.layers }, (_, index) =&gt; {
          const layer = index + 1;
          const spec = model.getLayer(layer);
          const attnClass = spec.attention === &#x27;dsa&#x27; ? &#x27;attn-dsa&#x27; : `attn-${spec.attention}`;
          const ffnClass = spec.ffn === &#x27;dense&#x27; ? &#x27;ffn-dense&#x27; : &#x27;ffn-moe&#x27;;
          const pressed = layer === state.selected[state.model];
          return `
            &lt;button type=&quot;button&quot; class=&quot;btn viz-tile layer-cell cursor-interaction&quot; data-layer=&quot;${layer}&quot; aria-pressed=&quot;${pressed}&quot; aria-label=&quot;第 ${layer} 层：${labels[spec.attention]} 加 ${labels[spec.ffn]}&quot;&gt;
              &lt;span class=&quot;layer-number&quot;&gt;${layer}&lt;/span&gt;
              &lt;span class=&quot;layer-tracks&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;track ${attnClass}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;track ${ffnClass}&quot;&gt;&lt;/span&gt;&lt;/span&gt;
            &lt;/button&gt;
          `;
        }).join(&#x27;&#x27;);

        root.querySelectorAll(&#x27;.layer-cell&#x27;).forEach((button) =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; selectLayer(Number(button.dataset.layer)));
        });
        root.querySelectorAll(&#x27;[data-jump]&#x27;).forEach((button) =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; selectLayer(Number(button.dataset.jump)));
        });
        renderDetail();
      }

      root.querySelector(&#x27;#model-glm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.model = &#x27;glm&#x27;;
        renderModel();
        persist();
      });
      root.querySelector(&#x27;#model-kimi&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.model = &#x27;kimi&#x27;;
        renderModel();
        persist();
      });
      root.querySelector(&#x27;#phase-prefill&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.phase = &#x27;prefill&#x27;;
        renderModel();
        persist();
      });
      root.querySelector(&#x27;#phase-decode&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.phase = &#x27;decode&#x27;;
        renderModel();
        persist();
      });
      root.querySelector(&#x27;#example-shape&#x27;).checked = state.example;
      root.querySelector(&#x27;#example-shape&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        state.example = event.target.checked;
        renderDetail();
        persist();
      });

      window.addEventListener(&#x27;openai:set_globals&#x27;, (event) =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState;
        const privateState = next &amp;&amp; next.privateContent;
        if (!privateState || !models[privateState.model]) return;
        state.model = privateState.model;
        if (privateState.layers) state.selected = { ...state.selected, ...privateState.layers };
        state.example = Boolean(privateState.example);
        state.phase = privateState.phase === &#x27;decode&#x27; ? &#x27;decode&#x27; : &#x27;prefill&#x27;;
        root.querySelector(&#x27;#example-shape&#x27;).checked = state.example;
        renderModel();
      });

      renderModel();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  };

    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;

    pinnedByTouch = false;

    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
